<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#172b4d">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="nameSetupModal" class="name-setup-overlay" role="dialog" aria-modal="true" aria-labelledby="nameSetupTitle">
  <div class="name-setup-card">
    <h2 id="nameSetupTitle">Edit Player Names</h2>
    <p class="name-setup-help">Enter the names of all four players.</p>
    <div class="name-setup-fields">
      <label><input id="setupName0" type="text" maxlength="30" placeholder="Bappi"></label>
      <label><input id="setupName1" type="text" maxlength="30" placeholder="Nahid"></label>
      <label><input id="setupName2" type="text" maxlength="30" placeholder="Mijan"></label>
      <label><input id="setupName3" type="text" maxlength="30" placeholder="Montu"></label>
    </div>
    <div class="name-setup-actions">
      <button id="savePlayerNames" class="primary name-setup-save" type="button">Save</button>
      <button id="cancelPlayerNames" class="secondary name-setup-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<main class="container">
  <h1>🏆 Number Winner Game</h1>
  <p class="subtitle">Edit the names and enter the numbers</p>
  <div class="sticky-game-top" id="stickyGameTop">
  <section class="winner-banner" aria-label="Winner announcement banner">
    <div class="winner-marquee" aria-live="polite">
      <span id="winnerMarqueeText">Bappi Won The Game</span>
    </div>
    <div class="winner-name-row">
      <input id="winnerNameInput" class="winner-name-input" type="text" value="Bappi" maxlength="30" aria-label="Edit marquee winner name" placeholder="Enter Number">
      <div class="language-picker">
        <button id="languageButton" class="language-button" type="button" aria-label="Choose voice language" aria-expanded="false">L</button>
        <div id="languageMenu" class="language-menu" hidden>
          <button type="button" data-lang="en-US">Eng</button>
          <button type="button" data-lang="bn-BD">Bang</button>
          <button type="button" data-lang="hi-IN">Hindi</button>
          <button type="button" data-lang="ur-PK">Urdu</button>
          <button type="button" data-lang="es-ES">Span</button>
        </div>
      </div>
    </div>
  </section>
<nav class="toolbar" aria-label="Game menu">
    <button class="secondary" id="voiceBtn" type="button" title="Enable Voice and Clap">🔊 Voice</button>
    <button class="primary" id="addBtn" type="button" title="Add Next Row">➕ Add</button>
    <button class="secondary" id="announceBtn" type="button" title="Announce Latest Winner">📣 Winner</button>
    <button class="danger" id="resetBtn" type="button" title="Reset Game">↻ Reset</button>
  </nav>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th><input class="name-input" aria-label="Player 1 name" value="Bappi"></th>
        <th><input class="name-input" aria-label="Player 2 name" value="Nahid"></th>
        <th><input class="name-input" aria-label="Player 3 name" value="Mijan"></th>
        <th><input class="name-input" aria-label="Player 4 name" value="Montu"></th>
      </tr></thead>
      <tbody id="results"></tbody>
      <tfoot>
        <tr><th id="total0">0</th><th id="total1">0</th><th id="total2">0</th><th id="total3">0</th></tr>
      </tfoot>
    </table>
  </div>
  <div id="announcement" aria-live="polite">Ready to Play!</div>
  <div class="round-info">Total Rounds: <span id="roundCount">0</span></div>
</main>
<footer class="game-footer"><span>© <span id="footerYear">2026</span> JABJAL</span><span>| <a class="footer-whatsapp" href="https://wa.me/16319924128" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp"><span class="footer-phone-icon">☎</span><span class="footer-phone-number">6319924128</span></a></span></footer>

  <script src="js/script.js"></script>
</body>
</html>
